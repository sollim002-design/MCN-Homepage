name: Update music catalog

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: music-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Refresh music from the public playlist
        run: python3 scripts/sync-music.py
      - name: Validate JavaScript and diff
        run: |
          node --check dist/content.js
          git diff --check
      - name: Commit only when the catalog changes
        id: catalog
        run: |
          if git diff --quiet -- dist/content.js; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/content.js
          git commit -m 'Update music from Sion playlist'
          git push origin HEAD
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Save updated static site
        if: steps.catalog.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kiyolive-static-site
          path: dist/
          retention-days: 1
